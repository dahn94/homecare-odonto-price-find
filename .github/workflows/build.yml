name: Build AppImage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install customtkinter Pillow reportlab thefuzz PyInstaller
          python -m pip show PyInstaller

      - name: Validate Python syntax
        run: |
          python -m py_compile $(find src -name '*.py' | sort)

      - name: Build binary with PyInstaller
        run: |
          python -m PyInstaller --onefile --windowed \
            --add-data "assets:assets" \
            --add-data "seeds:seeds" \
            main.py

      - name: Download AppImageTool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppDir
        run: |
          mkdir -p Basis.AppDir/usr/bin
          cp dist/main Basis.AppDir/usr/bin/basis
          chmod +x Basis.AppDir/usr/bin/basis

          cat > Basis.AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/basis"
          EOF
          chmod +x Basis.AppDir/AppRun

          cat > Basis.AppDir/basis.desktop <<'EOF'
          [Desktop Entry]
          Name=Basis Precificador
          Exec=basis
          Icon=basis
          Type=Application
          Categories=Utility;
          EOF

          cp assets/logo_basis.png Basis.AppDir/basis.png

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage Basis.AppDir
          if [ -f Basis-x86_64.AppImage ]; then mv Basis-x86_64.AppImage basis-precificador.AppImage; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: basis-precificador
          path: basis-precificador.AppImage